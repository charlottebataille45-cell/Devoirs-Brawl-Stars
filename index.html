<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e295e">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Devoirs Famille</title>
  <style>
  :root {
    --bg: #111833;
    --bg-deep: #0a0f22;
    --card: #1c2756;
    --text: #ffffff;
    --muted: #94a3b8;
    --border: #3b4c94;
    --primary: #3f63ff;
    --primary-dark: #2945c9;
    --yellow: #ffd43b;
    --yellow-dark: #d9a900;
    --blue: #25a9f4;
    --purple: #8b5cf6;
    --pink: #ff5fa2;
    --green: #20bf6b;
    --red: #ff5c57;
    --orange: #ff9f43;
    --nav: #162044;
    --radius: 20px;
    --nav-height: 72px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { 
    height: 100%; 
    background: var(--bg); 
    -webkit-text-size-adjust: 100%; 
    text-size-adjust: 100%; 
  }

  body {
    margin: 0;
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    height: 100%;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,212,59,.25) 0 50px, transparent 51px),
      radial-gradient(circle at 85% 25%, rgba(255,95,162,.2) 0 70px, transparent 71px),
      linear-gradient(180deg, #1b2659 0%, #0d122b 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior-y: none;
  }
  body.modal-open { overflow: hidden; }
  button, input, select, textarea { font: inherit; }
  button { touch-action: manipulation; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }

  .app-header {
    padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(135deg, #1f2d6e 0%, #46259e 55%, #821f7c 100%);
    color: #fff;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid #0a0e22;
    box-shadow: 0 5px 0 rgba(0,0,0,.3);
  }

  .header-copy { min-width: 0; }
  .app-header h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: .5px;
    text-shadow: 0 3px 0 #000;
  }
  #dateCourante {
    color: rgba(255,255,255,.85);
    font-size: 12px;
    margin-top: 6px;
    font-weight: 800;
    text-shadow: 0 1px 0 #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-refresh {
    width: 44px;
    height: 44px;
    border: 3px solid #0f1738;
    border-radius: 14px;
    background: var(--yellow);
    color: #17264f;
    font-size: 24px;
    line-height: 1;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    box-shadow: 0 4px 0 #b38600;
    cursor: pointer;
  }
  .header-refresh:active { transform: translateY(3px); box-shadow: 0 1px 0 #b38600; }
  .header-refresh.spinning { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .enfants-bar {
    padding: 10px 12px 6px;
    background: rgba(17,24,51,.95);
    flex-shrink: 0;
    z-index: 20;
  }
  .enfants-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    padding: 2px 2px 5px;
    -webkit-overflow-scrolling: touch;
  }
  .enfants-scroll::-webkit-scrollbar { display: none; }
  .enfant-btn {
    border: 3px solid #2e3d7a;
    background: #1a2552;
    border-radius: 999px;
    padding: 8px 16px;
    min-height: 42px;
    color: #fff;
    font-weight: 900;
    font-size: 14px;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
    box-shadow: 0 4px 0 #0f1638;
    text-shadow: 0 1px 0 #000;
  }
  .enfant-btn.active {
    background: linear-gradient(180deg, #ffd700, #ff8c00);
    color: #111;
    border-color: #fff;
    box-shadow: 0 4px 0 #b35900;
    text-shadow: none;
    transform: translateY(-1px);
  }

  /* TIMELINE HEBDOMADAIRE */
  .timeline-container {
    background: rgba(17,24,51,.98);
    border-bottom: 3px solid #0d122b;
    padding: 8px 12px 10px;
    flex-shrink: 0;
    z-index: 15;
  }
  .timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .timeline-title {
    font-size: 12px;
    font-weight: 900;
    color: #ffd700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .timeline-nav-btn {
    background: #243475;
    border: 2px solid #0d122b;
    color: #fff;
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 2px 0 #070a1a;
  }
  .timeline-nav-btn:active { transform: translateY(1px); box-shadow: none; }
  .timeline-days {
    display: flex;
    gap: 4px;
    justify-content: space-between;
  }
  .day-card {
    flex: 1;
    background: #1c2756;
    border: 2px solid #3b4c94;
    border-radius: 12px;
    padding: 6px 2px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .day-card.today {
    border-color: #ffd700;
    background: linear-gradient(180deg, #283777, #1c2756);
  }
  .day-card.selected {
    background: linear-gradient(180deg, #ffd700, #ff8c00) !important;
    color: #111 !important;
    border-color: #fff !important;
  }
  .day-name { font-size: 10px; font-weight: 900; text-transform: uppercase; opacity: 0.85; }
  .day-num { font-size: 14px; font-weight: 900; margin: 1px 0; }
  .day-card.selected .day-name, .day-card.selected .day-num { color: #111; opacity: 1; }
  .day-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #0d122b;
    color: #94a3b8;
    font-size: 9px;
    font-weight: 900;
    display: grid;
    place-items: center;
    margin-top: 2px;
  }
  .day-dot.has-tasks { background: #ff5c57; color: #fff; }
  .day-card.selected .day-dot { background: #111; color: #ffd700; }

  #contenu-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px calc(var(--nav-height) + 88px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  .profil-card {
    background: linear-gradient(135deg, #243475 0%, #462678 50%, #611867 100%);
    border: 4px solid #0d122b;
    border-radius: 22px;
    padding: 16px;
    margin: 4px 0 16px;
    color: #fff;
    box-shadow: 0 6px 0 #070a1a, inset 0 2px 0 rgba(255,255,255,0.25);
    position: relative;
    overflow: hidden;
  }
  .profil-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #ffd700, #ff3366, #00f2fe);
  }
  .profil-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .profil-titre-niveau { font-size: 18px; font-weight: 900; color: #ffd700; text-shadow: 0 2px 0 #000; }
  .brawl-level-badge {
    background: linear-gradient(180deg, #00f2fe, #0077b3);
    color: #fff;
    border: 3px solid #000;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 900;
    box-shadow: 0 2px 0 #000;
    text-transform: uppercase;
  }

  .section-title-bar {
    font-weight: 900; font-size: 16px; color: #111;
    background: linear-gradient(180deg, #ffd700, #ff9900);
    border: 3px solid #000; border-radius: 12px;
    padding: 6px 12px; margin: 16px 0 12px;
    box-shadow: 0 3px 0 #b35900; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }

  .counters-bar {
    background: rgba(0,0,0,0.4); border: 3px solid #3b4c94;
    border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;
    display: flex; justify-content: space-between; font-size: 13px; font-weight: 900;
  }

  .shop-card, .rec-card {
    background: linear-gradient(135deg, #1c2756 0%, #2a1b4e 100%);
    border: 4px solid #0d122b; border-radius: 20px;
    padding: 16px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 6px 0 #070a1a;
  }
  .rec-card.used { opacity: 0.65; background: linear-gradient(135deg, #121936 0%, #1a152e 100%); }

  .shop-item-top { display: flex; align-items: flex-start; gap: 12px; }
  .shop-icon {
    width: 50px; height: 50px; background: rgba(0,0,0,0.4);
    border: 3px solid #3b4c94; border-radius: 14px;
    display: grid; place-items: center; font-size: 26px; flex-shrink: 0;
  }
  .shop-info { flex: 1; min-width: 0; }
  .shop-title { font-size: 16px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #000; margin: 0; }
  .shop-desc { font-size: 12px; color: #cbd5e1; font-weight: 700; margin-top: 4px; line-height: 1.35; }
  .shop-footer { display: flex; justify-content: space-between; align-items: center; border-top: 2px dashed #3b4c94; padding-top: 10px; margin-top: 2px; }
  .shop-price { font-size: 15px; font-weight: 900; color: #ffd700; text-shadow: 0 1px 0 #000; }

  .btn-buy, .btn-use {
    background: linear-gradient(180deg, #20bf6b, #108046); color: #fff;
    border: 3px solid #0d122b; border-radius: 12px; padding: 8px 16px;
    font-weight: 900; font-size: 13px; cursor: pointer;
    box-shadow: 0 3px 0 #070a1a; text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  .btn-buy:active, .btn-use:active { transform: translateY(2px); box-shadow: 0 1px 0 #070a1a; }
  .btn-buy:disabled, .btn-use:disabled { background: #475569; border-color: #1e293b; box-shadow: 0 2px 0 #0f172a; opacity: 0.7; cursor: not-allowed; }

  .badge-used { background: #20bf6b; color: #fff; border: 2px solid #0d122b; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; }

  .charge-card {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1c2756 0%, #162044 100%);
    border: 4px solid #0d122b; border-radius: 20px;
    padding: 16px; margin: 4px 0 16px; box-shadow: 0 6px 0 #070a1a;
  }
  .charge-card::after {
    content: "★"; position: absolute; right: 12px; top: 8px;
    color: rgba(255,212,59,.9); font-size: 34px; text-shadow: 0 2px 0 #000; transform: rotate(12deg);
  }
  .charge-card > div:first-child { display:flex; align-items:center; gap:12px; }
  .charge-number { font-size: 26px; font-weight: 900; color: #ffd700; text-shadow: 0 2px 0 #000; }
  .charge-detail { color: #94a3b8; font-size: 12px; margin-top: 2px; font-weight: 800; }
  .progress { height: 14px; background:#0d122b; border-radius:99px; margin-top:12px; overflow:hidden; border:3px solid #3b4c94; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  .progress-bar { height:100%; background:linear-gradient(90deg,#00f2fe,#4facfe); transition:width .3s ease; box-shadow: 0 0 10px #00f2fe; }

  .jour-header { display:flex; align-items:center; margin:18px 3px 9px; scroll-margin-top: 10px; }
  .jour-title {
    font-weight: 900; font-size: 15px; color: #111;
    background: linear-gradient(180deg, #ffd700, #ff9900);
    border: 3px solid #000; border-radius: 12px; padding: 6px 12px;
    box-shadow: 0 3px 0 #b35900; text-transform: uppercase;
  }

  .devoir {
    position: relative; background: #1c2756;
    border: 4px solid #0d122b; border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; display:flex; flex-direction:column; gap:10px;
    box-shadow: 0 6px 0 #070a1a;
  }
  .devoir::before {
    content:""; position:absolute; left:-4px; top:-4px; bottom:-4px; width:10px;
    background:var(--blue); border-radius: 16px 0 0 16px; border-right: 2px solid #0d122b;
  }
  .devoir.en-retard::before { background: var(--red); }
  .devoir-top { display:flex; gap:12px; align-items:flex-start; }
  .devoir-check {
    width: 42px; height: 42px; flex-shrink:0; border:3px solid #0d122b; border-radius:50%;
    background: linear-gradient(180deg, #324796, #1c2756);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:20px; font-weight:900; color:#fff; box-shadow: 0 4px 0 #070a1a;
  }
  .devoir-check:active { transform:translateY(2px); box-shadow:0 1px 0 #070a1a; }
  .devoir.fait .devoir-check { background: linear-gradient(180deg, #20bf6b, #108046); }
  .devoir.fait { opacity:.6; }
  .devoir.fait .devoir-titre { text-decoration:line-through; color: #94a3b8; }
  .devoir-main { flex:1; min-width:0; }
  .devoir-title-row { display:flex; align-items:flex-start; gap:8px; }
  .devoir-titre { font-weight:900; margin:0; font-size:16px; line-height:1.3; flex:1; overflow-wrap:anywhere; color:#fff; text-shadow: 0 1px 0 #000; }
  .devoir-menu {
    width:38px; height:36px; flex:0 0 auto;
    border:3px solid #0d122b; border-radius:12px; background:#243475; color:#fff;
    font-weight:900; cursor:pointer; box-shadow:0 3px 0 #070a1a;
  }
  .devoir-menu:active { transform:translateY(2px); box-shadow:none; }
  .devoir-description { font-size:13px; color:#cbd5e1; margin-top:7px; line-height:1.35; font-weight:700; }
  .devoir-meta { display:flex; flex-wrap:wrap; gap:6px; color:#cbd5e1; font-size:12px; margin-top:8px; align-items:center; }
  .badge { background:#111833; border:2px solid #3b4c94; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:900; }
  .badge-enfant { background:#1a2f66; border-color:#5277ff; color:#7ab0ff; }
  .badge-haute { background:#661a1a; border-color:#ff5c57; color:#ff9996; }
  .retard-label { display:inline-flex; background:#661a1a; border:2px solid #ff5c57; color:#ff9996; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:900; margin-top:6px; }
  .devoir-actions { display:flex; justify-content:flex-end; gap:8px; border-top:2px dashed #3b4c94; padding-top:10px; }
  .devoir-actions.hidden { display:none; }
  .icon-btn { border:3px solid #0d122b; background:#243475; min-height:40px; padding:7px 14px; border-radius:12px; font-size:13px; font-weight:900; cursor:pointer; color:#fff; box-shadow:0 3px 0 #070a1a; }
  .icon-btn.danger { background:#802020; }

  .loading { min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:14px; font-weight:800; }
  .loading-spinner { width:28px; height:28px; border:4px solid #3b4c94; border-top-color:#ffd700; border-radius:50%; animation:spin .8s linear infinite; }

  .tabs-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; min-height: var(--nav-height);
    background: rgba(17,24,51,.98); border-top: 4px solid #0d122b;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 6px env(safe-area-inset-bottom);
    z-index: 100; box-shadow: 0 -8px 25px rgba(0,0,0,.4);
  }
  .tab { 
    background: transparent; border: 0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    gap: 2px; color: #8899cb; flex: 1; min-height: 58px; padding: 4px 2px; cursor: pointer; border-radius: 14px; font-weight: 900; max-width: 25%;
  }
  .tab.active { color: #111; background: linear-gradient(180deg, #ffd700, #ff9900); border: 2px solid #0d122b; box-shadow: 0 4px 0 #b35900; }
  .tab-icon { font-size: 20px; line-height: 1; }
  .tab-label { font-size: 10px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn-fab {
    position:fixed; bottom:calc(var(--nav-height) + 14px + env(safe-area-inset-bottom));
    right:max(14px, calc((100vw - 680px) / 2 + 14px));
    width:62px; height:62px; border-radius:20px; background:linear-gradient(180deg, #ffd700, #ff9900); color:#111;
    border:4px solid #0d122b; font-size:34px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 #0d122b, 0 9px 18px rgba(0,0,0,.4); z-index:110; cursor:pointer; transform:rotate(-3deg);
  }
  .btn-fab:active { transform:translateY(4px) rotate(-3deg); box-shadow:0 2px 0 #0d122b; }

  .modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:200; }
  .modal.hidden { display:none; }
  .modal-backdrop { position:absolute; inset:0; background:rgba(7,10,26,.8); backdrop-filter:blur(4px); }
  .modal-content { position:relative; width:min(100%, 430px); max-height:min(88dvh,780px); overflow-y:auto; background:#1c2756; border:4px solid #0d122b; border-radius:24px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.5); animation:popIn .18s ease-out; }
  .modal-handle { width:40px; height:5px; border-radius:99px; background:#3b4c94; margin:-4px auto 14px; }
  @keyframes popIn { from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-header h2 { margin:0; font-size:20px; font-weight:900; color:#ffd700; text-shadow: 0 2px 0 #000; }
  .close { width:42px; height:42px; border:3px solid #0d122b; border-radius:12px; background:#243475; color:#fff; font-size:28px; cursor:pointer; box-shadow:0 3px 0 #070a1a; }

  form label { display:block; font-weight:900; font-size:12px; color:#cbd5e1; margin-bottom:10px; text-transform: uppercase; }
  form input, form select, form textarea { width:100%; min-height:48px; margin-top:5px; border:3px solid #3b4c94; border-radius:14px; padding:10px 14px; background:#111833; color:var(--text); font-size:16px; font-weight:700; }
  form textarea { resize:vertical; min-height:90px; }
  form input:focus, form select:focus, form textarea:focus { border-color:#ffd700; outline:none; box-shadow:0 0 0 4px rgba(255,212,59,.2); }
  .form-primary-grid, .form-secondary-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .input-suffix { position:relative; }
  .input-suffix input { padding-right:48px; }
  .input-suffix span { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:13px; font-weight:900; }
  .advanced-toggle { width:100%; min-height:44px; margin:6px 0 10px; padding:10px 14px; background:#243475; border:3px solid #3b4c94; border-radius:14px; display:flex; align-items:center; justify-content:space-between; color:#fff; font-size:13px; font-weight:900; }
  .advanced-fields.hidden { display:none; }
  .modal-actions { position:sticky; bottom:-20px; background:#1c2756; margin:10px -20px -20px; padding:12px 20px calc(20px + env(safe-area-inset-bottom)); border-top:3px solid #3b4c94; }
  .btn-block { width:100%; min-height:52px; background:linear-gradient(180deg, #20bf6b, #108046); color:#fff; border:4px solid #0d122b; padding:11px 14px; border-radius:16px; font-size:17px; font-weight:900; cursor:pointer; box-shadow:0 4px 0 #0d122b; }
  .btn-block:active { transform:translateY(3px); box-shadow:none; }
  .form-error { margin:6px 0 10px; padding:10px 12px; border-radius:12px; background:#661a1a; border:3px solid #ff5c57; color:#ff9996; font-size:13px; font-weight:800; }
  .toast { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; max-width:calc(100vw - 28px); transform:translateX(-50%); background:#1c2756; color:#ffd700; border:4px solid #0d122b; padding:12px 18px; border-radius:999px; font-size:14px; font-weight:900; z-index:300; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .hidden { display:none !important; }

  @media (min-width:681px) {
    .tabs-bottom { left:50%; right:auto; width:680px; transform:translateX(-50%); border-left:4px solid #0d122b; border-right:4px solid #0d122b; border-radius:20px 20px 0 0; }
  }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-copy">
        <h1>⭐ Devoirs Famille</h1>
        <div id="dateCourante"></div>
      </div>
      <button class="header-refresh" type="button" onclick="rafraichirDonnees()" aria-label="Actualiser">↻</button>
    </header>

    <section class="enfants-bar" aria-label="Filtrer par enfant">
      <div id="listeEnfants" class="enfants-scroll"></div>
    </section>

    <!-- TIMELINE HEBDOMADAIRE -->
    <section id="timelineSemaine" class="timeline-container" aria-label="Planning de la semaine">
      <div class="timeline-header">
        <button class="timeline-nav-btn" type="button" onclick="changerSemaine(-1)">◀ Préc.</button>
        <span id="timelineTitle" class="timeline-title">Semaine</span>
        <button class="timeline-nav-btn" type="button" onclick="changerSemaine(1)">Suiv. ▶</button>
      </div>
      <div id="timelineDays" class="timeline-days"></div>
    </section>

    <main id="contenu-scroll">
      <section id="chargeContainer"></section>
      <div id="contenu">
        <div class="loading">
          <div class="loading-spinner" aria-hidden="true"></div>
          <span>Chargement…</span>
        </div>
      </div>
    </main>

    <button class="btn-fab" onclick="ouvrirFormulaire()" aria-label="Ajouter un devoir">+</button>

    <nav class="tabs-bottom" aria-label="Navigation principale">
      <button id="tabAujourdHui" class="tab active" type="button" onclick="changerVue('aujourdhui')">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">Aujourd’hui</span>
      </button>
      <button id="tabAVenir" class="tab" type="button" onclick="changerVue('tous')">
        <span class="tab-icon">🚀</span>
        <span class="tab-label">À venir</span>
      </button>
      <button id="tabRecompenses" class="tab" type="button" onclick="changerVue('recompenses')">
        <span class="tab-icon">🎁</span>
        <span class="tab-label">Récompenses</span>
      </button>
      <button id="tabBoutique" class="tab" type="button" onclick="changerVue('boutique')">
        <span class="tab-icon">🛒</span>
        <span class="tab-label">Boutique</span>
      </button>

  </div>

  <!-- MODAL DEVOIR -->
  <div id="modalDevoir" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitre">
    <div class="modal-backdrop" onclick="fermerFormulaire()"></div>
    <div class="modal-content">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="modalTitre">Ajouter un devoir</h2>
        <button class="close" type="button" onclick="fermerFormulaire()" aria-label="Fermer">×</button>
      </div>
      <form id="formDevoir" onsubmit="sauvegarderDevoir(event)">
        <input type="hidden" id="formIdDevoir">
        <div class="form-primary-grid">
          <label>Enfant <select id="formEnfant" required></select></label>
          <label>Matière <select id="formMatiere" required></select></label>
        </div>
        <label>Titre <input type="text" id="formTitre" required maxlength="200" placeholder="Ex. Exercices p. 42"></label>
        <div class="form-secondary-grid">
          <label>Échéance <input type="date" id="formDate" required></label>
          <label>Temps <div class="input-suffix"><input type="number" id="formDuree" min="0" step="5" value="20"><span>min</span></div></label>
        </div>
        <button class="advanced-toggle" id="advancedToggle" type="button" onclick="toggleOptionsAvancees()" aria-expanded="false">
          <span>Plus d’options</span><span id="advancedChevron">⌄</span>
        </button>
        <div id="advancedFields" class="advanced-fields hidden">
          <label>Description <textarea id="formDescription" rows="3"></textarea></label>
          <div class="form-secondary-grid">
            <label>Type <select id="formType" required></select></label>
            <label>Priorité <select id="formPriorite"></select></label>
          </div>
          <div class="form-secondary-grid">
            <label>Étape <input type="number" id="formEtape" min="1"></label>
            <label>Sur <input type="number" id="formNbEtapes" min="1"></label>
          </div>
          <label>Statut <select id="formStatut"></select></label>
        </div>
        <div id="formErreur" class="form-error hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="btnSauvegarder">Enregistrer</button>

  <!-- MODAL ANIMATION ACHAT -->
  <div id="modalAchatAide" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" onclick="fermerModalAchat()"></div>
    <div class="modal-content" style="text-align: center; padding: 24px;">
      <div style="font-size: 50px; margin-bottom: 10px;">🎉</div>
      <h2 style="color: #ffd700; margin: 0 0 10px; font-weight: 900;">RÉCOMPENSE DÉBLOQUÉE !</h2>
      <div id="achatTitreRec" style="font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 12px;"></div>
      <p style="color: #cbd5e1; font-size: 14px; font-weight: 700; margin-bottom: 20px;">
        La récompense a été ajoutée à ton coffre.
      </p>
      <button class="btn-block" type="button" onclick="voirMesRecompenses()">VOIR MES RÉCOMPENSES</button>
    </div>
  </div>

  <!-- MODAL CONFIRMATION UTILISATION -->
  <div id="modalConfirmUtiliser" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" onclick="fermerConfirmUtiliser()"></div>
    <div class="modal-content" style="text-align: center; padding: 24px;">
      <div style="font-size: 40px; margin-bottom: 8px;">🎁</div>
      <h2 style="color: #ffd700; margin: 0 0 10px; font-weight: 900;">Utiliser cette récompense ?</h2>
      <div id="confirmUtiliserTitre" style="font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 8px;"></div>
      <p style="color: #cbd5e1; font-size: 13px; font-weight: 700; margin-bottom: 20px;">
        Cette récompense passera dans ton historique.
      </p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="icon-btn" type="button" onclick="fermerConfirmUtiliser()">ANNULER</button>
        <button class="btn-buy" id="btnValiderUtilisation" type="button" onclick="validerUtilisationRecompense()">CONFIRMER</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwSBdQHLeLF_sGy0dVq3gtFPHIm2saKyYb2DMTidzVCXPXIdVoI1LY87mC0U8M6HhKb/exec";
    const GITHUB_RECOMPENSES_URL = "https://raw.githubusercontent.com/charlottebataille45-cell/Devoirs-Brawl-Stars/main/catalogueRecompenses.json";

    let devoirs = [];
    let enfants = [];
    let matieres = [];
    let priorites = [];
    let statuts = [];
    let types = [];
    let profils = [];
    let recompensesEnfant = { aUtiliser: [], utilisees: [], compteurs: { disponibles: 0, utilisees: 0 } };
    let catalogueRecompenses = [];

    let vueActuelle = 'aujourdhui';
    let enfantSelectionne = 'TOUS';
    let isProcessing = false;
    let recompenseAUtiliserTarget = null;
    let offsetSemaine = 0;
    let jourFiltreKey = null;

    function callAPI(action, payload) {
      const dataToSend = Object.assign({ action: action }, payload || {});
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataToSend)
      })
      .then(res => {
        if (!res.ok) throw new Error("Erreur réseau HTTP " + res.status);
        return res.json();
      });
    }

    function chargerCatalogueGitHub() {
      return fetch(GITHUB_RECOMPENSES_URL)
        .then(res => {
          if (!res.ok) throw new Error("Erreur de chargement du catalogue GitHub");
          return res.json();
        })
        .then(data => {
          catalogueRecompenses = data || [];
        })
        .catch(err => {
          console.error("Erreur catalogue GitHub:", err);
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
      afficherDateCourante();
      chargerCatalogueGitHub();
      chargerDonneesDeReference();
    });

    function afficherDateCourante() {
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const date = new Date().toLocaleDateString('fr-FR', options);
      document.getElementById('dateCourante').innerText = date.charAt(0).toUpperCase() + date.slice(1);
    }

    function rafraichirDonnees() {
      const btn = document.querySelector('.header-refresh');
      if (btn) btn.classList.add('spinning');

      callAPI('getDevoirsFamille')
        .then(response => {
          if (btn) btn.classList.remove('spinning');
          if (!response || !response.success) {
            return afficherErreur(response ? response.error.message : 'Erreur de chargement');
          }
          afficherToast('Données actualisées');
          devoirs = response.data || [];
          if ((vueActuelle === 'boutique' || vueActuelle === 'recompenses') && enfantSelectionne !== 'TOUS') {
            chargerSuiviRecompenses();
          } else {
            routerAffichage();
          }
        })
        .catch(err => {
          if (btn) btn.classList.remove('spinning');
          afficherErreur(err);
        });
    }

    function chargerDonneesDeReference() {
      callAPI('getInitialData')
        .then(response => {
          if (!response || !response.success) return afficherErreur(response ? response.error.message : 'Erreur API');
          
          enfants = response.data.enfants || [];
          matieres = response.data.matieres || [];
          statuts = response.data.statuts || [];
          priorites = response.data.priorites || [];
          types = response.data.types || [];
          profils = response.data.profils || [];

          genererFiltreEnfants();
          remplirListesDeroulantes();
          chargerDevoirs();
        })
        .catch(afficherErreur);
    }

    function chargerDevoirs() {
      callAPI('getDevoirsFamille')
        .then(response => {
          if (!response || !response.success) return afficherErreur(response ? response.error.message : 'Erreur Devoirs');
          devoirs = response.data || [];
          routerAffichage();
        })
        .catch(afficherErreur);
    }

    function genererFiltreEnfants() {
      const container = document.getElementById('listeEnfants');
      let html = `<button class="enfant-btn active" type="button" onclick="filtrerEnfant('TOUS', this)">Tous</button>`;
      
      enfants.forEach(e => {
        let nom = e.Prenom || e.Nom || e.ID_Enfant;
        html += `<button class="enfant-btn" type="button" onclick="filtrerEnfant('${e.ID_Enfant}', this)" aria-pressed="false">${echapperHTML(nom)}</button>`;
      });
      
      container.innerHTML = html;
    }

    function filtrerEnfant(id, btnElement) {
      enfantSelectionne = id;
      document.querySelectorAll('.enfant-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      btnElement.classList.add('active');
      btnElement.setAttribute('aria-pressed', 'true');

      if ((vueActuelle === 'boutique' || vueActuelle === 'recompenses') && id !== 'TOUS') {
        chargerSuiviRecompenses();
      } else {
        routerAffichage();
      }
    }

    function changerVue(vue) {
      vueActuelle = vue;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      
      if (vue === 'aujourdhui') document.getElementById('tabAujourdHui').classList.add('active');
      if (vue === 'tous') document.getElementById('tabAVenir').classList.add('active');
      if (vue === 'recompenses') document.getElementById('tabRecompenses').classList.add('active');
      if (vue === 'boutique') document.getElementById('tabBoutique').classList.add('active');
      
      const timelineEl = document.getElementById('timelineSemaine');
      if (vue === 'boutique' || vue === 'recompenses') {
        timelineEl.classList.add('hidden');
      } else {
        timelineEl.classList.remove('hidden');
      }

      if ((vue === 'boutique' || vue === 'recompenses') && enfantSelectionne !== 'TOUS') {
        chargerSuiviRecompenses();
      } else {
        routerAffichage();
      }
    }

    function routerAffichage() {
      const timelineEl = document.getElementById('timelineSemaine');

      if (vueActuelle === 'boutique') {
        timelineEl.classList.add('hidden');
        document.getElementById('chargeContainer').innerHTML = '';
        afficherBoutique();
      } else if (vueActuelle === 'recompenses') {
        timelineEl.classList.add('hidden');
        document.getElementById('chargeContainer').innerHTML = '';
        afficherMesRecompenses();
      } else {
        timelineEl.classList.remove('hidden');
        actualiserTimeline();
        afficherDevoirs();
      }
    }

    /* TIMELINE HEBDOMADAIRE JS */
    function getLundi(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function changerSemaine(delta) {
      offsetSemaine += delta;
      jourFiltreKey = null;
      actualiserTimeline();
      afficherDevoirs();
    }

    function filtrerJourTimeline(dateIso) {
      if (jourFiltreKey === dateIso) {
        jourFiltreKey = null;
      } else {
        jourFiltreKey = dateIso;
      }
      actualiserTimeline();

      if (vueActuelle === 'aujourdhui') {
        changerVue('tous');
      } else {
        afficherDevoirs();
      }

      if (jourFiltreKey) {
        setTimeout(() => {
          const targetAncre = document.getElementById('group-' + jourFiltreKey);
          if (targetAncre) {
            targetAncre.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 100);
      }
    }

    function actualiserTimeline() {
      const today = new Date();
      today.setHours(0,0,0,0);
      const todayKey = today.toISOString().split('T')[0];

      let refDate = new Date();
      refDate.setDate(refDate.getDate() + (offsetSemaine * 7));
      const lundi = getLundi(refDate);

      const devoirsFiltresEnfant = devoirs.filter(d => enfantSelectionne === 'TOUS' || d.ID_Enfant === enfantSelectionne);

      const daysContainer = document.getElementById('timelineDays');
      const titleEl = document.getElementById('timelineTitle');

      const dim = new Date(lundi);
      dim.setDate(lundi.getDate() + 6);
      
      const formatMois = (d) => d.toLocaleDateString('fr-FR', { month: 'short', day: 'numeric' });
      titleEl.innerText = `${formatMois(lundi)} - ${formatMois(dim)}`;

      let daysHTML = '';
      const nomJours = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

      for (let i = 0; i < 7; i++) {
        let cur = new Date(lundi);
        cur.setDate(lundi.getDate() + i);
        cur.setHours(0,0,0,0);
        
        let curKey = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;

        let count = devoirsFiltresEnfant.filter(d => {
          if (!d.Date_Echeance) return false;
          let dKey = d.Date_Echeance.split('T')[0];
          return dKey === curKey && d.Statut !== 'FAIT' && d.Statut !== 'ANNULE' && d.Statut !== 'TERMINE';
        }).length;

        let isToday = curKey === todayKey;
        let isSelected = curKey === jourFiltreKey;

        daysHTML += `
          <div class="day-card ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="filtrerJourTimeline('${curKey}')">
            <span class="day-name">${nomJours[i]}</span>
            <span class="day-num">${cur.getDate()}</span>
            <span class="day-dot ${count > 0 ? 'has-tasks' : ''}">${count}</span>
          </div>
        `;
      }

      daysContainer.innerHTML = daysHTML;
    }

    function chargerSuiviRecompenses() {
      callAPI('getRecompensesEnfant', { idEnfant: enfantSelectionne })
        .then(res => {
          if (res && res.success) {
            recompensesEnfant = res.data;
          }
          routerAffichage();
        })
        .catch(err => {
          afficherErreur(err);
          routerAffichage();
        });
    }

    function afficherBoutique() {
      const container = document.getElementById('contenu');

      if (enfantSelectionne === 'TOUS') {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px;">
            <div style="font-size: 48px; margin-bottom: 15px;">🛒</div>
            <h2 style="color: #ffd700; margin-bottom: 10px; font-weight: 900;">Boutique XP</h2>
            <p style="color: var(--muted); font-weight: 800; font-size: 15px; line-height: 1.4;">
              Choisis ton prénom en haut pour voir ton épargne XP et acheter des récompenses ! 🛒
            </p>
          </div>
        `;
        return;
      }

      let p = profils.find(x => String(x.ID_Enfant) === String(enfantSelectionne)) || {
        XP_Total: 0, XP_Disponibles: 0, Badges: 0, Niveau_Actuel: 1, Titre_Actuel: "Débutant"
      };

      let xpTotale = p.XP_Total !== undefined ? p.XP_Total : (p.XP_Totale || 0);
      let xpDispo = p.XP_Disponibles !== undefined ? p.XP_Disponibles : (p.XP_Dispo !== undefined ? p.XP_Dispo : xpTotale);

      let prochainObjectif = catalogueRecompenses.find(item => item.cout > xpDispo) || catalogueRecompenses[catalogueRecompenses.length - 1] || { cout: 100, icone: "🎁", titre: "Récompense" };
      let pourcentageObj = Math.min(100, Math.round((xpDispo / prochainObjectif.cout) * 100));
      let resteXP = Math.max(0, prochainObjectif.cout - xpDispo);

      let headerBoutique = `
        <div class="profil-card" style="margin-bottom: 20px;">
          <div class="profil-header" style="margin-bottom: 8px;">
            <div>
              <span class="brawl-level-badge">BOUTIQUE & ÉPARGNE</span>
              <div class="profil-titre-niveau" style="margin-top: 4px;">🎯 Ton Épargne XP</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 12px; color: #ffd700; font-weight: 900;">⭐ Total : ${xpTotale} XP</div>
              <div style="font-size: 11px; color: #cbd5e1; font-weight: 800;">🏆 Niveau ${p.Niveau_Actuel || 1}</div>
            </div>
          </div>

          <div style="background: rgba(0,0,0,0.45); border: 3px solid #324796; border-radius: 14px; padding: 12px; margin-top: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <span style="font-size: 14px; font-weight: 900; color: #ffd700;">💰 ${xpDispo} XP disponibles</span>
              <span style="font-size: 11px; font-weight: 800; color: #94a3b8;">${pourcentageObj}%</span>
            </div>
            <div style="font-size: 12px; color: #fff; font-weight: 800; margin-bottom: 8px;">
              Objectif : ${prochainObjectif.icone} ${prochainObjectif.titre} (${prochainObjectif.cout} XP)
            </div>
            <div class="progress" style="margin-top: 0; margin-bottom: 6px;">
              <div class="progress-bar" style="width: ${pourcentageObj}%;"></div>
            </div>
            <div style="font-size: 11px; color: #cbd5e1; font-weight: 800; text-align: right;">
              ${resteXP > 0 ? `Encore ${resteXP} XP pour l'atteindre !` : 'Objectif atteint ! Tu peux l\'acheter ! 🎉'}
            </div>
          </div>
        </div>
      `;

      let itemsCatalogueHTML = `<div class="section-title-bar">🛒 CATALOGUE DES RÉCOMPENSES</div>`;
      itemsCatalogueHTML += catalogueRecompenses.map(item => {
        const peutAcheter = xpDispo >= item.cout;
        return `
          <div class="shop-card">
            <div class="shop-item-top">
              <div class="shop-icon">${item.icone}</div>
              <div class="shop-info">
                <div class="shop-title">${echapperHTML(item.titre)}</div>
                <div class="shop-desc">${echapperHTML(item.desc)}</div>
              </div>
            </div>
            <div class="shop-footer">
              <div class="shop-price">⭐ ${item.cout} XP</div>
              <button class="btn-buy" ${peutAcheter ? '' : 'disabled'} onclick="commanderRecompense(${item.id})">
                ${peutAcheter ? 'ACHETER' : 'XP insuffisants'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = headerBoutique + itemsCatalogueHTML;
    }

    function afficherMesRecompenses() {
      const container = document.getElementById('contenu');

      if (enfantSelectionne === 'TOUS') {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px;">
            <div style="font-size: 48px; margin-bottom: 15px;">🎁</div>
            <h2 style="color: #ffd700; margin-bottom: 10px; font-weight: 900;">Mes Récompenses</h2>
            <p style="color: var(--muted); font-weight: 800; font-size: 15px; line-height: 1.4;">
              Choisis ton prénom en haut pour ouvrir ton coffre à récompenses ! 🎁
            </p>
          </div>
        `;
        return;
      }

      let mesRecompensesHTML = `
        <div class="section-title-bar">🎁 MES RÉCOMPENSES</div>
        <div class="counters-bar">
          <span style="color: #ffd700;">🎁 Disponibles : ${recompensesEnfant.compteurs.disponibles}</span>
          <span style="color: #20bf6b;">✓ Utilisées : ${recompensesEnfant.compteurs.utilisees}</span>
        </div>
      `;

      mesRecompensesHTML += `<div style="font-size: 13px; font-weight: 900; color: #ffd700; margin: 12px 0 8px; text-transform: uppercase;">À UTILISER</div>`;
      if (recompensesEnfant.aUtiliser.length === 0) {
        mesRecompensesHTML += `<div style="text-align:center; padding: 20px; color: var(--muted); font-size: 13px; font-weight: 800;">Aucune récompense en attente d'utilisation.</div>`;
      } else {
        mesRecompensesHTML += recompensesEnfant.aUtiliser.map(r => {
          const itemCat = catalogueRecompenses.find(c => c.id === Number(r.ID_Catalogue)) || { icone: "🎁" };
          const dAchat = r.Date_Achat ? new Date(r.Date_Achat).toLocaleDateString('fr-FR') : '';
          return `
            <div class="rec-card">
              <div class="shop-item-top">
                <div class="shop-icon">${itemCat.icone}</div>
                <div class="shop-info">
                  <div class="shop-title">${echapperHTML(r.Titre)}</div>
                  <div class="shop-desc">Obtenue le ${dAchat} (${r.Cout_XP} XP)</div>
                </div>
              </div>
              <div class="shop-footer">
                <span class="shop-price" style="font-size: 12px; color: #cbd5e1;">Statut : À utiliser</span>
                <button class="btn-use" onclick="demanderUtiliserRecompense('${r.ID_Recompense}', '${echapperHTML(r.Titre).replace(/'/g, "\\'")}', '${itemCat.icone}')">UTILISER</button>
              </div>
            </div>
          `;
        }).join('');
      }

      mesRecompensesHTML += `<div style="font-size: 13px; font-weight: 900; color: var(--muted); margin: 20px 0 8px; text-transform: uppercase;">HISTORIQUE</div>`;
      if (recompensesEnfant.utilisees.length === 0) {
        mesRecompensesHTML += `<div style="text-align:center; padding: 20px; color: var(--muted); font-size: 13px; font-weight: 800;">Aucune récompense dans l'historique.</div>`;
      } else {
        mesRecompensesHTML += recompensesEnfant.utilisees.map(r => {
          const itemCat = catalogueRecompenses.find(c => c.id === Number(r.ID_Catalogue)) || { icone: "🎁" };
          const dAchat = r.Date_Achat ? new Date(r.Date_Achat).toLocaleDateString('fr-FR') : '';
          const dUtil = r.Date_Utilisation ? new Date(r.Date_Utilisation).toLocaleDateString('fr-FR') : '';
          return `
            <div class="rec-card used">
              <div class="shop-item-top">
                <div class="shop-icon">${itemCat.icone}</div>
                <div class="shop-info">
                  <div class="shop-title">${echapperHTML(r.Titre)}</div>
                  <div class="shop-desc">Obtenue le ${dAchat} | Utilisée le ${dUtil}</div>
                </div>
              </div>
              <div class="shop-footer">
                <span class="badge-used">✓ Utilisée</span>
              </div>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = mesRecompensesHTML;
    }

    function commanderRecompense(idCatalogue) {
      if (isProcessing) return;
      isProcessing = true;

      const item = catalogueRecompenses.find(c => c.id === idCatalogue);
      
      callAPI('acheterRecompense', { idEnfant: enfantSelectionne, idCatalogue: idCatalogue })
        .then(res => {
          isProcessing = false;
          if (res && res.success) {
            let p = profils.find(x => String(x.ID_Enfant) === String(enfantSelectionne));
            if (p) {
              if (p.XP_Disponibles !== undefined) p.XP_Disponibles = res.data.nouveauSoldeXP;
              else if (p.XP_Dispo !== undefined) p.XP_Dispo = res.data.nouveauSoldeXP;
              else p.XP_Total = res.data.nouveauSoldeXP;
            }
            
            chargerSuiviRecompenses();

            document.getElementById('achatTitreRec').innerText = (item ? item.icone + ' ' : '') + (item ? item.titre : '');
            document.getElementById('modalAchatAide').classList.remove('hidden');
          } else {
            const err = res && res.error ? res.error.message : 'ERREUR_SERVEUR';
            traiterErreurAPI(err);
          }
        })
        .catch(err => {
          isProcessing = false;
          afficherErreur(err);
        });
    }

    function fermerModalAchat() {
      document.getElementById('modalAchatAide').classList.add('hidden');
    }

    function voirMesRecompenses() {
      fermerModalAchat();
      changerVue('recompenses');
    }

    function demanderUtiliserRecompense(idRecompense, titre, icone) {
      recompenseAUtiliserTarget = idRecompense;
      document.getElementById('confirmUtiliserTitre').innerText = icone + " " + titre;
      document.getElementById('modalConfirmUtiliser').classList.remove('hidden');
    }

    function fermerConfirmUtiliser() {
      recompenseAUtiliserTarget = null;
      document.getElementById('modalConfirmUtiliser').classList.add('hidden');
    }

    function validerUtilisationRecompense() {
      if (!recompenseAUtiliserTarget || isProcessing) return;
      isProcessing = true;

      const btn = document.getElementById('btnValiderUtilisation');
      btn.disabled = true;

      callAPI('utiliserRecompense', { idEnfant: enfantSelectionne, idRecompense: recompenseAUtiliserTarget })
        .then(res => {
          isProcessing = false;
          btn.disabled = false;
          fermerConfirmUtiliser();

          if (res && res.success) {
            afficherToast("🎉 Récompense validée et passée à l'historique !");
            chargerSuiviRecompenses();
          } else {
            const err = res && res.error ? res.error.message : 'ERREUR_SERVEUR';
            traiterErreurAPI(err);
          }
        })
        .catch(err => {
          isProcessing = false;
          btn.disabled = false;
          fermerConfirmUtiliser();
          afficherErreur(err);
        });
    }

    function traiterErreurAPI(errCode) {
      switch(errCode) {
        case 'XP_INSUFFISANTS': afficherToast("⚠️ Tu n'as pas assez d'XP disponibles !"); break;
        case 'RECOMPENSE_INTROUVABLE': afficherToast("⚠️ Récompense introuvable."); break;
        case 'RECOMPENSE_DEJA_UTILISEE': afficherToast("⚠️ Cette récompense a déjà été utilisée !"); break;
        case 'RECOMPENSE_APPARTIENT_AUTRE_ENFANT': afficherToast("⚠️ Cette récompense appartient à un autre enfant."); break;
        case 'ENFANT_INTROUVABLE': afficherToast("⚠️ Profil enfant introuvable."); break;
        default: afficherToast("⚠️ Erreur serveur lors de l'opération.");
      }
    }

    function getNomEnfant(id) {
      const e = enfants.find(x => x.ID_Enfant === id);
      return e ? (e.Prenom || e.Nom || id) : id;
    }

    function getNomMatiere(id) {
      const m = matieres.find(x => x.ID_Matiere === id || x.Code === id);
      return m ? (m.Matiere || m.Code || id) : id;
    }

    function afficherDevoirs() {
      const container = document.getElementById('contenu');
      container.innerHTML = '';
      
      let devoirsFiltres = devoirs.filter(d => enfantSelectionne === 'TOUS' || d.ID_Enfant === enfantSelectionne);
      
      const aujourdhui = new Date();
      aujourdhui.setHours(0, 0, 0, 0);

      const estFaitOuAnnule = (d) => d.Statut === 'FAIT' || d.Statut === 'ANNULE' || d.Statut === 'TERMINE';
      let idCibleAAncre = null;
      
      if (vueActuelle === 'aujourdhui') {
        devoirsFiltres = devoirsFiltres.filter(d => {
          if (!d.Date_Echeance) return false;
          let dateD = new Date(d.Date_Echeance);
          dateD.setHours(0, 0, 0, 0);
          return !estFaitOuAnnule(d) && dateD.getTime() <= aujourdhui.getTime();
        });
      } else if (jourFiltreKey) {
        devoirsFiltres = devoirsFiltres.filter(d => d.Date_Echeance && d.Date_Echeance.split('T')[0] === jourFiltreKey);
      }

      devoirsFiltres.sort((a, b) => {
        let dateA = a.Date_Echeance ? new Date(a.Date_Echeance).getTime() : 0;
        let dateB = b.Date_Echeance ? new Date(b.Date_Echeance).getTime() : 0;
        return dateA - dateB;
      });

      calculerCharge(devoirsFiltres);

      if (devoirsFiltres.length === 0) {
        container.innerHTML += '<div style="text-align:center; padding:30px 20px; color:var(--muted); font-weight:800;">Aucun devoir pour cette sélection. Bien joué ! 🎉</div>';
        return;
      }
      
      let html = '';
      let currentGroup = '';

      const now = new Date();
      const aujourdhuiKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      devoirsFiltres.forEach(d => {
        let dateObj = d.Date_Echeance ? new Date(d.Date_Echeance) : null;
        let dateKeyGroup = d.Date_Echeance ? d.Date_Echeance.split('T')[0] : 'sans-date';
        let dateStr = dateObj ? dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Sans date';
        
        if (dateStr !== currentGroup) {
          html += `<div id="group-${dateKeyGroup}" class="jour-header"><div class="jour-title">${dateStr.charAt(0).toUpperCase() + dateStr.slice(1)}</div></div>`;
          currentGroup = dateStr;
        }

        const estFait = estFaitOuAnnule(d);
        const nomMatiere = getNomMatiere(d.ID_Matiere);
        const nomEnfant = getNomEnfant(d.ID_Enfant);
        
        let badgeEnfantHTML = enfantSelectionne === 'TOUS' ? `<span class="badge badge-enfant">👤 ${echapperHTML(nomEnfant)}</span>` : '';
        let badgePriorite = (d.Priorite === 'HAUTE' || d.Priorite === 'URGENTE') ? `<span class="badge badge-haute">🔥 ${d.Priorite}</span>` : '';
        let badgeEtapes = (d.Etape && d.Nb_Etapes) ? `<span class="badge">Étape ${d.Etape}/${d.Nb_Etapes}</span>` : '';

        const dateKey = d.Date_Echeance ? d.Date_Echeance.split('T')[0] : '';
        const estEnRetard = !estFait && dateKey && dateKey < aujourdhuiKey;

        if (vueActuelle === 'tous' && !idCibleAAncre && !estFait && dateObj && !jourFiltreKey) {
          let dateD = new Date(dateObj);
          dateD.setHours(0, 0, 0, 0);
          if (dateD.getTime() >= aujourdhui.getTime()) {
            idCibleAAncre = 'devoir-' + d.ID_Devoir;
          }
        }

        html += `
          <article id="devoir-${d.ID_Devoir}" class="devoir ${estFait ? 'fait' : ''} ${estEnRetard ? 'en-retard' : ''}">
            <div class="devoir-top">
              <button
                class="devoir-check"
                type="button"
                onclick="cocherDevoir('${d.ID_Devoir}', '${d.Statut}')"
                aria-label="${estFait ? 'Marquer comme à faire' : 'Marquer comme fait'}">
                ${estFait ? '✓' : ''}
              </button>

              <div class="devoir-main">
                <div class="devoir-title-row">
                  <div class="devoir-titre">${echapperHTML(d.Titre)}</div>
                  <button class="devoir-menu" type="button" onclick="toggleMenuDevoir(this)" aria-label="Actions du devoir" aria-expanded="false">•••</button>
                </div>

                <div class="devoir-meta">
                  ${badgeEnfantHTML}
                  <span>📚 ${echapperHTML(nomMatiere)}</span>
                  <span>⏱ ${d.Duree_Estimee_Min || 0} min</span>
                  ${badgePriorite} ${badgeEtapes}
                </div>

                ${estEnRetard ? `<div class="retard-label">En retard</div>` : ''}
                ${d.Description ? `<div class="devoir-description">${echapperHTML(d.Description)}</div>` : ''}
              </div>
            </div>

            <div class="devoir-actions hidden">
              <button class="icon-btn" type="button" onclick="editerDevoir('${d.ID_Devoir}')">Modifier</button>
              <button class="icon-btn danger" type="button" onclick="supprimerDevoirUI('${d.ID_Devoir}')">Supprimer</button>
            </div>
          </article>
        `;
      });

      container.innerHTML += html;

      if (vueActuelle === 'tous' && !jourFiltreKey) {
        setTimeout(() => {
          if (idCibleAAncre) {
            const el = document.getElementById(idCibleAAncre);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 150);
      }
    }

    function calculerCharge(devoirsFiltres) {
      const container = document.getElementById('chargeContainer');
      if (!container) return;

      const totalMin = devoirsFiltres.reduce((sum, d) => sum + Number(d.Duree_Estimee_Min || 0), 0);
      const estFaitReel = (d) => d.Statut === 'FAIT' || d.Statut === 'TERMINE';
      const faitsMin = devoirsFiltres
        .filter(d => estFaitReel(d))
        .reduce((sum, d) => sum + Number(d.Duree_Estimee_Min || 0), 0);

      const nbDevoirsTotal = devoirsFiltres.length;
      const nbDevoirsFaits = devoirsFiltres.filter(d => estFaitReel(d)).length;

      if (nbDevoirsTotal === 0 && enfantSelectionne === 'TOUS') {
        container.innerHTML = '';
        return;
      }

      const pourcentage = totalMin > 0 ? Math.round((faitsMin / totalMin) * 100) : 0;

      let labelVue = vueActuelle === 'aujourdhui' ? "Aujourd'hui" : (jourFiltreKey ? "Jour sélectionné" : "À venir");

      container.innerHTML = `
        <div class="charge-card">
          <div>
            <div class="charge-number">${faitsMin} / ${totalMin} min</div>
          </div>
          <div class="charge-detail">
            ${nbDevoirsFaits} sur ${nbDevoirsTotal} devoir(s) terminé(s) (${labelVue})
          </div>
          <div class="progress">
            <div class="progress-bar" style="width: ${pourcentage}%;"></div>
          </div>
        </div>
      `;
    }

    function toggleMenuDevoir(button) {
      const card = button.closest('.devoir');
      if (!card) return;

      const menu = card.querySelector('.devoir-actions');
      if (!menu) return;

      const ouvert = !menu.classList.contains('hidden');

      document.querySelectorAll('.devoir-actions').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.devoir-menu').forEach(el => el.setAttribute('aria-expanded', 'false'));

      if (!ouvert) {
        menu.classList.remove('hidden');
        button.setAttribute('aria-expanded', 'true');
      }
    }

    function cocherDevoir(idDevoir, statutActuel) {
      const estDejaFait = (statutActuel === 'FAIT' || statutActuel === 'TERMINE' || statutActuel === 'ANNULE');
      const nouveauStatut = estDejaFait ? 'A_FAIRE' : 'FAIT';
      
      callAPI('changerStatut', { idDevoir: idDevoir, nouveauStatut: nouveauStatut })
        .then(response => {
          if (!response || !response.success) {
            afficherErreur(response ? response.error.message : 'Erreur statut');
            rafraichirDonnees();
          } else {
            if (response.data && response.data.gamification) {
              const gami = response.data.gamification;

              let profilLocal = profils.find(x => String(x.ID_Enfant) === String(enfantSelectionne));
              if (profilLocal) {
                profilLocal.XP_Total = gami.nouveauXPTotal;
                if (profilLocal.XP_Disponibles !== undefined) profilLocal.XP_Disponibles += gami.xpGagnes;
                profilLocal.Niveau_Actuel = gami.niveau;
              }

              let messageToast = nouveauStatut === 'FAIT' ? `🎉 Validé ! +${gami.xpGagnes} XP` : 'Devoir remis à faire';
              afficherToast(messageToast);
            } else {
              afficherToast(nouveauStatut === 'FAIT' ? 'Devoir validé ! 🎉' : 'Devoir remis à faire');
            }
            rafraichirDonnees();
          }
        })
        .catch(err => {
          afficherErreur(err);
          rafraichirDonnees();
        });
    }

    function ouvrirFormulaire(idDevoir) {
      const modal = document.getElementById('modalDevoir');
      const form = document.getElementById('formDevoir');
      const titreModal = document.getElementById('modalTitre');
      const errDiv = document.getElementById('formErreur');

      errDiv.classList.add('hidden');
      errDiv.innerText = '';
      form.reset();

      document.getElementById('advancedFields').classList.add('hidden');
      document.getElementById('advancedToggle').setAttribute('aria-expanded', 'false');

      if (idDevoir) {
        const d = devoirs.find(x => String(x.ID_Devoir) === String(idDevoir));
        if (d) {
          titreModal.innerText = 'Modifier le devoir';
          document.getElementById('formIdDevoir').value = d.ID_Devoir;
          document.getElementById('formEnfant').value = d.ID_Enfant || '';
          document.getElementById('formMatiere').value = d.ID_Matiere || '';
          document.getElementById('formTitre').value = d.Titre || '';
          
          let dateVal = '';
          if (d.Date_Echeance) {
            const dt = new Date(d.Date_Echeance);
            dateVal = !isNaN(dt.getTime()) ? dt.toISOString().split('T')[0] : d.Date_Echeance;
          }
          document.getElementById('formDate').value = dateVal;
          document.getElementById('formDuree').value = d.Duree_Estimee_Min || 20;

          document.getElementById('formDescription').value = d.Description || '';
          document.getElementById('formType').value = d.Type || 'DEVOIR';
          document.getElementById('formPriorite').value = d.Priorite || 'NORMALE';
          document.getElementById('formEtape').value = d.Etape || '';
          document.getElementById('formNbEtapes').value = d.Nb_Etapes || '';
          document.getElementById('formStatut').value = d.Statut || 'A_FAIRE';

          if (d.Description || d.Etape || d.Nb_Etapes || d.Priorite === 'HAUTE' || d.Priorite === 'URGENTE') {
            document.getElementById('advancedFields').classList.remove('hidden');
            document.getElementById('advancedToggle').setAttribute('aria-expanded', 'true');
          }
        }
      } else {
        titreModal.innerText = 'Ajouter un devoir';
        document.getElementById('formIdDevoir').value = '';
        
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        document.getElementById('formDate').value = today;

        if (enfantSelectionne !== 'TOUS') {
          document.getElementById('formEnfant').value = enfantSelectionne;
        }
      }

      modal.classList.remove('hidden');
      document.body.classList.add('modal-open');
    }

    function editerDevoir(idDevoir) { ouvrirFormulaire(idDevoir); }

    function fermerFormulaire() {
      const modal = document.getElementById('modalDevoir');
      modal.classList.add('hidden');
      document.body.classList.remove('modal-open');
    }

    function toggleOptionsAvancees() {
      const fields = document.getElementById('advancedFields');
      const toggleBtn = document.getElementById('advancedToggle');
      const cache = fields.classList.contains('hidden');

      if (cache) {
        fields.classList.remove('hidden');
        toggleBtn.setAttribute('aria-expanded', 'true');
      } else {
        fields.classList.add('hidden');
        toggleBtn.setAttribute('aria-expanded', 'false');
      }
    }

    function sauvegarderDevoir(event) {
      event.preventDefault();
      const btnSave = document.getElementById('btnSauvegarder');
      const errDiv = document.getElementById('formErreur');

      errDiv.classList.add('hidden');
      errDiv.innerText = '';

      const idDevoir = document.getElementById('formIdDevoir').value;
      const payload = {
        idEnfant: document.getElementById('formEnfant').value,
        idMatiere: document.getElementById('formMatiere').value,
        titre: document.getElementById('formTitre').value.trim(),
        dateEcheance: document.getElementById('formDate').value,
        dureeEstimeeMin: Number(document.getElementById('formDuree').value || 0),
        description: document.getElementById('formDescription').value.trim(),
        type: document.getElementById('formType').value || 'DEVOIR',
        priorite: document.getElementById('formPriorite').value || 'NORMALE',
        etape: document.getElementById('formEtape').value || '',
        nbEtapes: document.getElementById('formNbEtapes').value || '',
        statut: document.getElementById('formStatut').value || 'A_FAIRE'
      };

      if (!payload.idEnfant || !payload.idMatiere || !payload.titre || !payload.dateEcheance) {
        errDiv.innerText = 'Veuillez remplir tous les champs obligatoires.';
        errDiv.classList.remove('hidden');
        return;
      }

      btnSave.disabled = true;
      btnSave.innerText = 'Enregistrement…';

      const action = idDevoir ? 'modifierDevoir' : 'ajouterDevoir';
      const apiPayload = idDevoir ? { idDevoir: idDevoir, data: payload } : { data: payload };

      callAPI(action, apiPayload)
        .then(response => {
          btnSave.disabled = false;
          btnSave.innerText = 'Enregistrer';

          if (!response || !response.success) {
            const msg = response && response.error ? response.error.message : 'Erreur lors de l’enregistrement';
            errDiv.innerText = msg;
            errDiv.classList.remove('hidden');
          } else {
            fermerFormulaire();
            afficherToast(idDevoir ? 'Devoir modifié avec succès !' : 'Devoir ajouté avec succès !');
            rafraichirDonnees();
          }
        })
        .catch(err => {
          btnSave.disabled = false;
          btnSave.innerText = 'Enregistrer';
          errDiv.innerText = String(err);
          errDiv.classList.remove('hidden');
        });
    }

    function supprimerDevoirUI(idDevoir) {
      if (!confirm('Voulez-vous vraiment supprimer ce devoir ?')) return;

      callAPI('supprimerDevoir', { idDevoir: idDevoir })
        .then(response => {
          if (!response || !response.success) {
            afficherErreur(response ? response.error.message : 'Erreur lors de la suppression');
          } else {
            afficherToast('Devoir supprimé');
            rafraichirDonnees();
          }
        })
        .catch(afficherErreur);
    }

    function remplirListesDeroulantes() {
      const selectEnfant = document.getElementById('formEnfant');
      selectEnfant.innerHTML = '<option value="">-- Choisir un enfant --</option>' +
        enfants.map(e => `<option value="${e.ID_Enfant}">${echapperHTML(e.Prenom || e.Nom || e.ID_Enfant)}</option>`).join('');

      const selectMatiere = document.getElementById('formMatiere');
      selectMatiere.innerHTML = '<option value="">-- Choisir une matière --</option>' +
        matieres.map(m => `<option value="${m.ID_Matiere || m.Code}">${echapperHTML(m.Matiere || m.Code)}</option>`).join('');

      const selectType = document.getElementById('formType');
      selectType.innerHTML = types.length > 0
        ? types.map(t => `<option value="${t.Code || t.Type}">${echapperHTML(t.Libelle || t.Type || t.Code)}</option>`).join('')
        : '<option value="DEVOIR">Devoir</option><option value="LECON">Leçon</option>';

      const selectPriorite = document.getElementById('formPriorite');
      selectPriorite.innerHTML = priorites.length > 0
        ? priorites.map(p => `<option value="${p.Code || p.Priorite}">${echapperHTML(p.Libelle || p.Priorite || p.Code)}</option>`).join('')
        : '<option value="NORMALE">Normale</option><option value="HAUTE">Haute</option><option value="URGENTE">Urgente</option>';

      const selectStatut = document.getElementById('formStatut');
      selectStatut.innerHTML = statuts.length > 0
        ? statuts.map(s => `<option value="${s.Code || s.Statut}">${echapperHTML(s.Libelle || s.Statut || s.Code)}</option>`).join('')
        : '<option value="A_FAIRE">À faire</option><option value="EN_COURS">En cours</option><option value="FAIT">Fait</option><option value="REPORTE">Reporté</option><option value="ANNULE">Annulé</option>';
    }

    function afficherToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    function afficherErreur(erreur) {
      const msg = typeof erreur === 'object' && erreur.message ? erreur.message : String(erreur);
      afficherToast('⚠️ ' + msg);
    }

    function echapperHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.devoir-menu') && !e.target.closest('.devoir-actions')) {
        document.querySelectorAll('.devoir-actions').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.devoir-menu').forEach(el => el.setAttribute('aria-expanded', 'false'));
      }
    });
  </script>
</body>
</html>
